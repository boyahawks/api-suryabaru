version: "3.8"

services:
  caddy:
    image: caddy:latest
    container_name: suryabaru_caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

  backend:
    build: .
    container_name: backend
    restart: always
    expose:
      - "3500"
    env_file:
      - .env

volumes:
  caddy_data:
  caddy_config:
